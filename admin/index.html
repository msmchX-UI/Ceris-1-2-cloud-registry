<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Ceris-1-2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #6366f1; --accent-hover: #4f52d0;
      --text: #e2e8f0; --muted: #64748b;
      --error: #f87171; --success: #34d399;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 380px;
    }
    .login-card h1 { font-size: 20px; margin-bottom: 4px; }
    .login-card p.sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .err-msg { color: var(--error); font-size: 13px; margin-bottom: 12px; min-height: 18px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .login-field input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 9px 12px; color: var(--text); font-size: 14px; outline: none;
    }
    .login-field input:focus { border-color: var(--accent); }
    .btn-login { width: 100%; margin-top: 6px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: background .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-danger { background: #3b1f1f; color: var(--error); }
    .btn-danger:hover:not(:disabled) { background: #5a2121; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.05); }

    /* ── Dashboard ── */
    #dashboard { display: none; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .topbar-brand { font-weight: 700; font-size: 16px; }
    .topbar-brand span { color: var(--accent); }
    .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .badge { background: var(--accent); color: #fff; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .main-content { max-width: 860px; margin: 0 auto; padding: 36px 20px; }
    .section-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 24px; margin-bottom: 28px;
    }
    .section-card h2 { font-size: 15px; margin-bottom: 6px; }
    .section-card p.hint { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .add-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .add-row input {
      flex: 1; min-width: 200px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .user-list { list-style: none; }
    .user-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 6px; font-size: 13px;
    }
    .user-item:nth-child(odd) { background: rgba(255,255,255,.03); }
    .user-item-name { font-weight: 600; }
    .user-item-actions { display: flex; gap: 8px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* ── Toast ── */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 18px; font-size: 13px; opacity: 0;
      transform: translateY(10px); transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.t-error { border-color: var(--error); color: var(--error); }
    .toast.t-success { border-color: var(--success); color: var(--success); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>Ceris-1-2 <span style="color:var(--accent)">Admin</span></h1>
    <p class="sub">Sign in with your admin credentials to manage users</p>
    <div class="err-msg" id="login-err"></div>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" name="username" autocomplete="username" placeholder="admin" required />
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-login" id="btn-signin">Sign in</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">Ceris-1-2 <span>Registry</span></div>
    <div class="topbar-right">
      <span id="tb-user"></span>
      <span class="badge">Admin</span>
      <button class="btn btn-sm btn-ghost" id="btn-logout">Sign out</button>
    </div>
  </div>
  <div class="main-content">

    <!-- General users -->
    <div class="section-card">
      <h2>General Users</h2>
      <p class="hint">Add or remove general (non-admin) users.</p>
      <div class="add-row">
        <input type="email" id="u-email" placeholder="user@example.com" autocomplete="off" />
        <button class="btn btn-primary" id="btn-add-user">Add User</button>
      </div>
      <ul class="user-list" id="list-users"></ul>
    </div>

    <!-- Admin users -->
    <div class="section-card">
      <h2>Admin Users</h2>
      <p class="hint">Add or remove admin users. At least one admin must remain.</p>
      <div class="add-row">
        <input type="email" id="a-email" placeholder="admin@example.com" autocomplete="off" />
        <button class="btn btn-primary" id="btn-add-admin">Add Admin</button>
      </div>
      <ul class="user-list" id="list-admins"></ul>
    </div>

  </div>
</div>

<!-- Toast container -->
<div class="toast-wrap" id="toasts"></div>

<script>
  /* ── Config ─────────────────────────────────────────────── */
  const SHEETS_API = 'https://script.google.com/macros/s/AKfycbxIq4SSUP9c24kU8KCcXLd0-3xZdM60ApRo55Q9AHiJUo7Aj57-XiKeUtmUJcXpbi6UIw/exec';
  const LOGOUT_URL = 'https://msmchx-ui.github.io/Ceris-1-2-cloud-registry/';

  /* ── State ──────────────────────────────────────────────── */
  var _token    = '';
  var _username = '';
  var _allUsers = [];

  /* ── API helper ─────────────────────────────────────────── */
  function callApi(action, extra) {
    var body = Object.assign({ action: action, token: _token }, extra || {});
    return fetch(SHEETS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(resp) {
      return resp.json().catch(function() { return null; });
    }).then(function(data) {
      if (!data) throw new Error('Server returned an invalid (non-JSON) response.');
      if (data.ok === false) throw new Error(data.error || 'API error');
      return data;
    });
  }

  /* ── Login form ─────────────────────────────────────────── */
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var errEl    = document.getElementById('login-err');
    var btn      = document.getElementById('btn-signin');
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    errEl.textContent = '';
    if (!username || !password) { errEl.textContent = 'Username and password are required.'; return; }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    fetch(SHEETS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', username: username, password: password })
    }).then(function(resp) {
      return resp.json().catch(function() { return null; });
    }).then(function(data) {
      if (!data) throw new Error('Server returned an invalid (non-JSON) response.');
      if (data.ok === false) throw new Error(data.error || 'Login failed');
      if (data.role !== 'admin') throw new Error('Access denied: account is not an admin.');
      sessionStorage.setItem('admin_token', data.token);
      _token    = data.token;
      _username = data.username;
      showDashboard(_username);
    }).catch(function(err) {
      errEl.textContent = err.message;
    }).then(function() {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    });
  });

  /* ── Dashboard ──────────────────────────────────────────── */
  function showDashboard(username) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display    = 'block';
    document.getElementById('tb-user').textContent        = username;
    loadAndRender();
  }

  function loadAndRender() {
    callApi('listUsers').then(function(data) {
      _allUsers = Array.isArray(data.users) ? data.users : [];
      renderAll();
    }).catch(function(err) {
      toast('Failed to load users: ' + err.message, 'error');
    });
  }

  /* ── Render ─────────────────────────────────────────────── */
  function renderAll() { renderList('user'); renderList('admin'); }

  function renderList(role) {
    var listId = role === 'admin' ? 'list-admins' : 'list-users';
    var ul = document.getElementById(listId);
    ul.innerHTML = '';
    var items  = _allUsers.filter(function(u) { return u.role === role; });
    var admins = _allUsers.filter(function(u) { return u.role === 'admin'; });
    if (!items.length) {
      ul.innerHTML = '<li class="empty">No ' + (role === 'admin' ? 'admin' : 'general') + ' users yet.</li>';
      return;
    }
    items.forEach(function(u) {
      var li = document.createElement('li');
      li.className = 'user-item';
      var isLastAdmin = role === 'admin' && admins.length <= 1;
      // Note: the logged-in user is identified by username (admins sheet),
      // while entries in this list are identified by email (users sheet).
      // There is no reliable cross-identifier self-check here; last-admin
      // protection covers the critical case.
      var disabledAttr = isLastAdmin
        ? ' disabled title="Last admin cannot be removed"'
        : '';
      li.innerHTML =
        '<span class="user-item-name">' + escHtml(u.email) + '</span>' +
        '<span class="user-item-actions">' +
          '<button class="btn btn-sm btn-danger" data-action="remove" data-email="' + escHtml(u.email) + '" data-role="' + role + '"' +
            disabledAttr + '>Remove</button>' +
        '</span>';
      ul.appendChild(li);
    });
  }

  /* ── Add user ───────────────────────────────────────────── */
  document.getElementById('btn-add-user').addEventListener('click',  function() { addUser('user'); });
  document.getElementById('btn-add-admin').addEventListener('click', function() { addUser('admin'); });

  function addUser(role) {
    var inputId = role === 'admin' ? 'a-email' : 'u-email';
    var email   = document.getElementById(inputId).value.trim().toLowerCase();
    var btn     = document.getElementById(role === 'admin' ? 'btn-add-admin' : 'btn-add-user');
    if (!email) { toast('Email is required.', 'error'); return; }
    btn.disabled = true;
    callApi('upsertUser', { email: email, role: role }).then(function() {
      document.getElementById(inputId).value = '';
      toast((role === 'admin' ? 'Admin' : 'User') + ' "' + escHtml(email) + '" added.', 'success');
      return loadAndRender();
    }).catch(function(err) {
      toast('Error adding ' + role + ': ' + err.message, 'error');
    }).then(function() {
      btn.disabled = false;
    });
  }

  /* ── Remove (event delegation) ──────────────────────────── */
  document.getElementById('list-users').addEventListener('click',  handleListClick);
  document.getElementById('list-admins').addEventListener('click', handleListClick);

  function handleListClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    if (btn.dataset.action === 'remove') removeUser(btn.dataset.email, btn.dataset.role);
  }

  function removeUser(email, role) {
    var admins = _allUsers.filter(function(u) { return u.role === 'admin'; });
    if (role === 'admin' && admins.length <= 1) {
      toast('Cannot remove the last admin.', 'error'); return;
    }
    callApi('removeUser', { email: email }).then(function() {
      toast('"' + escHtml(email) + '" removed.', 'success');
      return loadAndRender();
    }).catch(function(err) {
      toast('Error removing user: ' + err.message, 'error');
    });
  }

  /* ── Logout ─────────────────────────────────────────────── */
  document.getElementById('btn-logout').addEventListener('click', function() {
    sessionStorage.removeItem('admin_token');
    _token    = '';
    _username = '';
    _allUsers = [];
    window.location.href = LOGOUT_URL;
  });

  /* ── Helpers ────────────────────────────────────────────── */
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toast(msg, type) {
    var wrap = document.getElementById('toasts');
    var el   = document.createElement('div');
    el.className = 'toast t-' + type;
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(function() { el.classList.add('show'); });
    setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { el.remove(); }, 300);
    }, 3200);
  }

  /* ── Init ───────────────────────────────────────────────── */
  (function init() {
    var saved = sessionStorage.getItem('admin_token');
    if (!saved) return;
    _token = saved;
    fetch(SHEETS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'whoami', token: _token })
    }).then(function(r) { return r.json().catch(function() { return null; }); })
    .then(function(data) {
      if (data && data.ok && data.isAdmin) {
        _username = data.username;
        showDashboard(_username);
      } else {
        sessionStorage.removeItem('admin_token');
        _token = '';
      }
    }).catch(function() {
      sessionStorage.removeItem('admin_token');
      _token = '';
    });
  })();
</script>
</body>
</html>
